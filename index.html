<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Recibos</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
    height: 100%;
    background: #e9edf3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-family: 'Inter', sans-serif;
}
.main-card {
    background: white;
    width: 100%;
    max-width: 780px;
    border-radius: 28px;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
    padding: 40px 45px 30px 45px;
    display: flex;
    flex-direction: column;
    min-height: 90vh;          /* menos que 100vh para evitar corte no topo */
    position: relative;
}
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid #eef2f6;
    padding-bottom: 18px;
    margin-bottom: 28px;
}
.header h1 { font-size: 26px; font-weight: 700; color: #0b1a2e; }
.header h1 span { background: #0b1a2e; color: white; padding: 2px 14px; border-radius: 40px; font-size: 18px; font-weight: 600; }
.badge { background: #e8edf3; color: #1e3a5f; padding: 6px 18px; border-radius: 40px; font-size: 13px; font-weight: 600; }

.form-grid { display: flex; flex-direction: column; gap: 16px; }
.field-row { display: flex; align-items: center; gap: 16px; }
.field-row label { width: 200px; font-weight: 600; font-size: 14px; color: #1e2a3a; flex-shrink: 0; }
.field-row input, .field-row textarea {
    flex: 1;
    padding: 12px 16px;
    border: 1.5px solid #dce3ec;
    border-radius: 12px;
    font-size: 15px;
    font-family: 'Inter', sans-serif;
    background: #fafcfe;
    transition: 0.2s;
}
.field-row input[type="date"] { font-family: 'Inter', sans-serif; font-size: 15px; color: #0b1a2e; }
.field-row input:focus, .field-row textarea:focus {
    outline: none;
    border-color: #1e3a5f;
    box-shadow: 0 0 0 4px rgba(30,58,95,0.08);
}

.formal-declaration {
    margin: 18px 0 12px 0;
    padding: 16px 22px;
    background: #f8faff;
    border-left: 5px solid #1e3a5f;
    border-radius: 16px;
    border: 1px solid #e9eef3;
    border-left-width: 5px;
    font-size: 15px;
    line-height: 1.6;
    text-align: justify;
}

/* --- ASSINATURA NO FINAL DA PÁGINA (flex) --- */
.signature-block {
    margin-top: auto;
    text-align: center;
    padding-top: 20px;
    background: white;
}
.signature-line {
    width: 280px;
    height: 2px;
    background: #1e3a5f;
    margin: 0 auto 8px auto;
    border-radius: 4px;
}
.signature-label {
    font-size: 13px;
    font-weight: 600;
    color: #5d7188;
    text-transform: uppercase;
    letter-spacing: 1.5px;
}

.btn-generate {
    margin: 20px 0 40px 0;      /* margem inferior para não colar na borda */
    padding: 16px;
    width: 100%;
    max-width: 780px;
    background: #0b1a2e;
    color: white;
    border: none;
    border-radius: 60px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(11,26,46,0.25);
}
.btn-generate:hover { background: #142c47; transform: scale(1.01); }

/* ========== CONFIGURAÇÃO PARA IMPRESSÃO (PDF) ========== */
@media print {
    html, body {
        height: 100%;
        background: white;
        padding: 0;
        margin: 0;
    }
    .main-card {
        box-shadow: none;
        border-radius: 0;
        padding: 8px 25px 8px 25px;   /* reduzido ao máximo para caber */
        max-width: 100%;
        border: none;
        height: 100%;
        min-height: 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
    }
    .btn-generate { display: none !important; }
    .badge { display: none; }

    .header {
        padding-bottom: 10px;
        margin-bottom: 12px;
    }
    .header h1 { font-size: 22px; }
    .header h1 span { font-size: 15px; padding: 0 10px; }

    .form-grid { gap: 6px; }
    .field-row { gap: 8px; }
    .field-row label {
        width: 140px;
        font-size: 11px;
        font-weight: 600;
    }
    .field-row input, .field-row textarea {
        padding: 5px 8px;
        font-size: 12px;
        border: 1px solid #aaa;
        background: white;
        box-shadow: none;
    }
    .field-row input[type="date"] { font-size: 12px; }

    .formal-declaration {
        margin: 8px 0 6px 0;
        padding: 8px 14px;
        font-size: 12px;
        line-height: 1.4;
        border-left-width: 3px;
    }

    .signature-block {
        margin-top: auto;
        padding-top: 10px;
    }
    .signature-line {
        width: 180px;
        height: 1.5px;
    }
    .signature-label {
        font-size: 10px;
        letter-spacing: 1px;
    }
}

@media (max-width: 650px) {
    .main-card { padding: 20px; min-height: auto; }
    .header { flex-direction: column; align-items: flex-start; gap: 8px; }
    .header h1 { font-size: 22px; }
    .field-row { flex-direction: column; align-items: stretch; gap: 5px; }
    .field-row label { width: 100%; }
    .btn-generate { max-width: 100%; margin-bottom: 20px; }
}

/* ========== MODAL ========== */
.modal-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
}
.modal-box {
    background: white;
    padding: 30px 40px;
    border-radius: 24px;
    max-width: 460px;
    width: 90%;
    box-shadow: 0 30px 60px rgba(0,0,0,0.3);
    text-align: center;
}
.modal-box h3 { font-size: 22px; color: #0b1a2e; margin-bottom: 12px; }
.modal-box p { font-size: 16px; color: #2c3e50; line-height: 1.5; margin-bottom: 24px; }
.modal-box button { background: #0b1a2e; color: white; border: none; padding: 10px 32px; border-radius: 40px; font-size: 16px; font-weight: 600; cursor: pointer; }
.modal-box button:hover { background: #142c47; }
</style>
</head>
<body>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
        <h3 id="modalTitle">Aviso</h3>
        <p id="modalMessage">Mensagem aqui</p>
        <button onclick="fecharModal()">OK</button>
    </div>
</div>

<!-- Container principal -->
<div class="main-card" id="receipt-container">
    <div class="header">
        <h1>Recibo <span>PDF</span></h1>
        <span class="badge">Comprovante digital</span>
    </div>

    <div class="form-grid">
        <div class="field-row">
            <label>Recebido de (Nome / Razão Social):</label>
            <input type="text" id="nomePagador" placeholder="Nome completo ou razão social do pagador">
        </div>
        <div class="field-row">
            <label>CPF / CNPJ (pagador):</label>
            <input type="text" id="cpfPagador" placeholder="CPF ou CNPJ" maxlength="18">
        </div>
        <div class="field-row">
            <label>Valor pago (R$):</label>
            <input type="text" id="valor" placeholder="0,00" value="0,00">
        </div>
        <div class="field-row">
            <label>Referente a:</label>
            <input type="text" id="referente" placeholder="Descrição da obrigação">
        </div>
        <div class="field-row">
            <label>Data do pagamento:</label>
            <input type="date" id="dataPagamento">
        </div>
        <div class="field-row">
            <label>Recebedor (Nome / Razão Social):</label>
            <input type="text" id="meuNome" placeholder="Nome ou razão social de quem recebe">
        </div>
        <div class="field-row">
            <label>CPF / CNPJ (Recebedor):</label>
            <input type="text" id="meuCpf" placeholder="CPF ou CNPJ" maxlength="18">
        </div>
    </div>

    <div class="formal-declaration">
        <strong>Declaração:</strong> Para os devidos fins, declaro que recebi o valor supra mencionado, 
        referente à obrigação discriminada neste recibo, dando plena e irrevogável quitação.
    </div>

    <!-- Assinatura no final -->
    <div class="signature-block">
        <div class="signature-line"></div>
        <span class="signature-label">Assinatura do emitente</span>
    </div>
</div>

<button class="btn-generate" onclick="gerarEAbrirPDF()">Gerar recibo</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
function mostrarModal(mensagem) {
    document.getElementById('modalMessage').textContent = mensagem;
    document.getElementById('modalOverlay').style.display = 'flex';
}
function fecharModal() {
    document.getElementById('modalOverlay').style.display = 'none';
}

function aplicarMascaraCPF_CNPJ(campo) {
    let valor = campo.value.replace(/\D/g, '');
    if (valor.length <= 11) {
        valor = valor.replace(/(\d{3})(\d)/, '$1.$2');
        valor = valor.replace(/(\d{3})(\d)/, '$1.$2');
        valor = valor.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
    } else {
        valor = valor.replace(/^(\d{2})(\d)/, '$1.$2');
        valor = valor.replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3');
        valor = valor.replace(/\.(\d{3})(\d)/, '.$1/$2');
        valor = valor.replace(/(\d{4})(\d)/, '$1-$2');
    }
    campo.value = valor;
}

function validarCPF_CNPJ(valor) {
    const numeros = valor.replace(/\D/g, '');
    if (numeros.length === 0) return true;
    if (numeros.length === 11) {
        if (/^(\d)\1{10}$/.test(numeros)) return false;
        let soma = 0;
        for (let i=0; i<9; i++) soma += parseInt(numeros.charAt(i)) * (10 - i);
        let resto = 11 - (soma % 11);
        let digito1 = (resto >= 10) ? 0 : resto;
        if (parseInt(numeros.charAt(9)) !== digito1) return false;
        soma = 0;
        for (let i=0; i<10; i++) soma += parseInt(numeros.charAt(i)) * (11 - i);
        resto = 11 - (soma % 11);
        let digito2 = (resto >= 10) ? 0 : resto;
        return parseInt(numeros.charAt(10)) === digito2;
    } else if (numeros.length === 14) {
        if (/^(\d)\1{13}$/.test(numeros)) return false;
        let tamanho = 12, soma = 0;
        for (let i=0; i<tamanho; i++) soma += parseInt(numeros.charAt(i)) * (tamanho - i + 1);
        let resto = soma % 11;
        let digito1 = (resto < 2) ? 0 : 11 - resto;
        if (parseInt(numeros.charAt(12)) !== digito1) return false;
        tamanho = 13; soma = 0;
        for (let i=0; i<tamanho; i++) soma += parseInt(numeros.charAt(i)) * (tamanho - i + 1);
        resto = soma % 11;
        let digito2 = (resto < 2) ? 0 : 11 - resto;
        return parseInt(numeros.charAt(13)) === digito2;
    }
    return false;
}

document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('dataPagamento').value = new Date().toISOString().split('T')[0];
    const campos = ['cpfPagador', 'meuCpf'];
    campos.forEach(id => {
        const campo = document.getElementById(id);
        campo.addEventListener('input', function() { aplicarMascaraCPF_CNPJ(this); });
        campo.addEventListener('blur', function() {
            const val = this.value.trim();
            if (val !== '' && !validarCPF_CNPJ(val)) {
                mostrarModal('O documento informado não é válido. Verifique o CPF ou CNPJ digitado.');
            }
        });
    });
    document.getElementById('valor').addEventListener('blur', function() {
        let v = this.value.replace(',', '.').replace(/[^0-9.]/g, '');
        let num = parseFloat(v);
        this.value = isNaN(num) ? '0,00' : num.toFixed(2).replace('.', ',');
    });
});

function gerarEAbrirPDF() {
    const campos = ['cpfPagador', 'meuCpf'];
    for (let id of campos) {
        const campo = document.getElementById(id);
        const val = campo.value.trim();
        if (val !== '' && !validarCPF_CNPJ(val)) {
            mostrarModal('O documento informado não é válido. Corrija o CPF ou CNPJ antes de gerar o recibo.');
            return;
        }
    }
    const element = document.getElementById('receipt-container');
    const opt = {
        margin: [0.5, 0.5, 0.5, 0.5],   // margens reduzidas para aproveitar espaço
        filename: 'recibo_oficial.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, letterRendering: true, useCORS: true, logging: false },
        jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
    };
    html2pdf().set(opt).from(element).outputPdf('blob').then(function(blob) {
        const url = URL.createObjectURL(blob);
        const novaAba = window.open(url, '_blank');
        if (!novaAba || novaAba.closed) {
            const link = document.createElement('a');
            link.href = url;
            link.download = 'recibo_oficial.pdf';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(() => URL.revokeObjectURL(url), 5000);
        } else {
            setTimeout(() => URL.revokeObjectURL(url), 10000);
        }
    }).catch(function(err) {
        console.error(err);
        mostrarModal('Erro ao gerar o PDF. Tente novamente.');
    });
}
</script>
</body>
</html>
